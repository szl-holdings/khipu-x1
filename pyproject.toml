[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khipu-x1"
version = "0.1.1"
description = "FPGA-first governed LLM accelerator software reference"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
khipu-x1 = "khipu_x1.cli:main"

[project.urls]
Homepage = "https://github.com/szl-holdings/khipu-x1"
Source = "https://github.com/szl-holdings/khipu-x1"
Issues = "https://github.com/szl-holdings/khipu-x1/issues"
Changelog = "https://github.com/szl-holdings/khipu-x1/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.szl.release]
import_names = ["khipu_x1"] # wheel top-level import names; the release gate fails if the built wheel differs
